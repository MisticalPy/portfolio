<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
// Захардкоженный запасной набор — если ./projects.json недоступен
// (сеть/404), карточки всё равно не пропадают со страницы.
const PROJECTS_FALLBACK = [
  {
    id: 'proj-1',
    title: 'Sprint Task Tracker',
    year: '2026',
    img: './assets/sprint-task-tracker.png',
    url: 'https://gitlab.com/django_pet_project1/sprint-task-tracker',
    detailUrl: './Project-SprintTaskTracker.dc.html',
    descriptionRu: 'Fullstack pet-проект: трекер задач по спринтам с самостоятельно спроектированной архитектурой — JWT-аутентификация под SPA, Celery+Redis для фоновых задач, CI через GitHub Actions, интеграция с Anthropic API.',
    descriptionEn: 'A fullstack pet project: a sprint task tracker with a self-designed architecture — JWT auth for an SPA setup, Celery+Redis for background jobs, CI via GitHub Actions, and an Anthropic API integration.',
    tags: ['Django', 'DRF', 'Vue 3', 'Celery', 'Redis', 'Docker', 'JWT']
  },
  {
    id: 'proj-2',
    title: 'KohiAnime',
    year: '2026',
    img: './assets/kohianime.png',
    url: 'https://gitlab.com/django_pet_project1/KohiAnime',
    detailUrl: './Project-KohiAnime.dc.html',
    descriptionRu: 'Каталог аниме на Django с фильтрами, пользовательскими профилями и кастомной админкой. Первый крупный проект — архитектура с нуля, кастомный middleware, CI/CD с первого дня.',
    descriptionEn: 'An anime catalog built on Django with filters, user profiles, and a custom admin. My first large project — architecture from scratch, a custom middleware, and CI/CD from day one.',
    tags: ['Django', 'Bootstrap', 'CI/CD', 'PostgreSQL']
  }
];

const TRANSLATIONS = {
  ru: {
    selectedWork: 'Избранные работы',
    titleA: 'Избранные',
    titleB: 'работы',
    intro: 'Два проекта, где архитектура придумана и собрана с нуля — от схемы данных до контейнеров и CI.',
    details: 'Подробнее →',
    viewRepo: 'Репозиторий →',
    workInquiries: 'По вопросам работы',
    home: 'На главную'
  },
  en: {
    selectedWork: 'Selected Work',
    titleA: 'Selected',
    titleB: 'work',
    intro: 'Two projects where the architecture was designed and built from scratch — from the data schema to containers and CI.',
    details: 'Details →',
    viewRepo: 'View repository →',
    workInquiries: 'Work inquiries',
    home: 'Home'
  }
};

class Component extends DCLogic {
  state = {
    lang: (typeof localStorage !== 'undefined' && localStorage.getItem('portfolio-lang')) || 'ru',
    projects: PROJECTS_FALLBACK
  };

  setRootRef = (node) => { this.rootEl = node; };
  setProgressRef = (node) => { this.progressEl = node; };

  setLang = (lang) => {
    this.setState({ lang });
    if (typeof localStorage !== 'undefined') localStorage.setItem('portfolio-lang', lang);
  };

  componentDidMount() {
    this.onScroll = () => {
      if (!this.progressEl) return;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      this.progressEl.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    requestAnimationFrame(() => this.setupReveals());

    // Список проектов редактируется отдельно от кода — прямо в projects.json
    // на GitHub. Фолбэк-массив выше остаётся на случай, если файл недоступен
    // (сеть, 404), чтобы карточки не пропадали со страницы.
    fetch('./projects.json')
      .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
      .then((projects) => { if (Array.isArray(projects) && projects.length) this.setState({ projects }); })
      .catch(() => {});
  }

  componentDidUpdate() {
    // Карточки проектов подгружаются асинхронно и рендерятся уже после
    // первого прохода setupReveals — без повторного наблюдения они бы
    // остались с opacity:0 навсегда.
    requestAnimationFrame(() => this.observeNewReveals());
  }

  componentWillUnmount() {
    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);
    if (this.io) this.io.disconnect();
  }

  setupReveals() {
    if (!this.rootEl) return;
    const targets = this.rootEl.querySelectorAll('[data-reveal]');

    // Разметка ожила — аварийное «показать всё» больше не нужно.
    if (window.__vRescue) { clearTimeout(window.__vRescue); window.__vRescue = null; }

    if (!('IntersectionObserver' in window)) {
      targets.forEach((el) => el.classList.add('is-in'));
      return;
    }

    // Наблюдаем фактическое пересечение, а не заранее посчитанные координаты:
    // шрифты и превью догружаются уже после монтирования и двигают вёрстку,
    // из-за чего нижние блоки могли так и не доехать до показа.
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-in');
        this.io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.01 });

    targets.forEach((el) => this.io.observe(el));
  }

  // Догоняет reveal-наблюдение после того, как DOM обновился (например,
  // подгрузились карточки проектов) — safe re-observe, IntersectionObserver
  // не даёт дублей на уже отслеживаемых элементах.
  observeNewReveals() {
    if (!this.rootEl || !this.io) return;
    this.rootEl.querySelectorAll('[data-reveal]:not(.is-in)').forEach((el) => this.io.observe(el));
  }

  renderVals() {
    const lang = this.state.lang;
    const t = TRANSLATIONS[lang] || TRANSLATIONS.ru;
    return {
      setRootRef: this.setRootRef,
      setProgressRef: this.setProgressRef,
      t: t,
      isRu: lang === 'ru',
      isEn: lang === 'en',
      setLangRu: () => this.setLang('ru'),
      setLangEn: () => this.setLang('en'),
      projects: this.state.projects.map((p) => ({ ...p, desc: lang === 'en' ? p.descriptionEn : p.descriptionRu }))
    };
  }
}
</script>
